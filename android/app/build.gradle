plugins {
    id "com.android.application"

    // Firebase
    id "com.google.firebase.crashlytics"
    id "com.google.gms.google-services"

    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Load keystore properties
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.mysteriouscoder.budgetflow"

    compileSdk = 36

    // Required for 16 KB page-size support
    ndkVersion = "28.2.13676358"

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.mysteriouscoder.budgetflow"

        minSdkVersion = flutter.minSdkVersion

        targetSdk = 36

        versionCode = flutter.versionCode.toInteger()
        versionName = flutter.versionName

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]

                storeFile = keystoreProperties["storeFile"]
                        ? file(keystoreProperties["storeFile"])
                        : null

                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release

            ndk {
                debugSymbolLevel = "FULL"
            }

            minifyEnabled = true
            shrinkResources = true

            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Firebase
    implementation "com.google.firebase:firebase-crashlytics-ktx:19.4.4"
    implementation "com.google.firebase:firebase-analytics-ktx:22.5.0"

    // Java 8+ API desugaring
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}