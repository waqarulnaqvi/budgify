buildscript {
    ext.kotlin_version = '2.1.0'   // ✅ Updated Kotlin version

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
//        classpath 'com.android.tools.build:gradle:8.5.2'// Android Gradle Plugin
        classpath 'com.android.tools.build:gradle:8.12.3'// Android Gradle Plugin
        classpath 'com.google.gms:google-services:4.4.4'   // Firebase
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6' // Crashlytics
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
